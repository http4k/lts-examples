[versions]
http4k = "6.61.0.0"
http4k-standards = "1.32.0.0"
junit = "6.1.3"
junit-platform = "6.1.3"
kotlin = "2.4.21"
typeflows = "0.34.0-beta"
version-catalog-update = "1.1.1"
versions = "0.66.0"

[libraries]
http4k-bom = { module = "org.http4k:http4k-bom", version.ref = "http4k" }
http4k-core = { module = "org.http4k:http4k-core" }
http4k-standards = { module = "org.http4k:typeflows", version.ref = "http4k-standards" }
http4k-testing-hamkrest = { module = "org.http4k:http4k-testing-hamkrest" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
typeflows-github = { module = "io.typeflows:typeflows-github", version.ref = "typeflows" }
typeflows-github-marketplace = { module = "io.typeflows:typeflows-github-marketplace", version.ref = "typeflows" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
typeflows = { id = "io.typeflows", version.ref = "typeflows" }
verify = { id = "org.http4k.verify", version.ref = "http4k" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versions" }
